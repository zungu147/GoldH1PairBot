name: Build GoldH1PairBot

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install cTrader CLI
        run: |
          brew tap spotware/tap https://github.com/spotware/homebrew-tap
          brew install spotware/tap/ctrader-cli

      - name: Check cTrader CLI
        run: |
          ctrader-cli --version
          ctrader-cli --help

      - name: Build GoldH1PairBot
        run: |
          ctrader-cli build GoldH1PairBot.csproj

      - name: Find ALGO file
        run: |
          find . -type f -name "*.algo" -print

      - name: Upload ALGO
        uses: actions/upload-artifact@v4
        with:
          name: GoldH1PairBot-algo
          path: "**/*.algo"