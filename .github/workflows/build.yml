name: Build GoldH1PairBot

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install cTrader CLI
        run: |
          wget -q https://github.com/spotware/ctrader-console-docker/releases/latest/download/ctrader-cli-linux-x64.tar.gz
          tar -xzf ctrader-cli-linux-x64.tar.gz
          chmod +x ctrader-cli
          sudo mv ctrader-cli /usr/local/bin/ctrader-cli

      - name: Build cBot
        run: |
          ctrader-cli build GoldH1PairBot.csproj

      - name: Find generated ALGO
        run: |
          find . -type f -name "*.algo" -print

      - name: Upload ALGO file
        uses: actions/upload-artifact@v4
        with:
          name: GoldH1PairBot-algo
          path: "**/*.algo"