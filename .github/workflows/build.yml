name: Build GoldH1PairBot

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 6 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.x

      - name: Restore dependencies
        run: dotnet restore GoldH1PairBot/GoldH1PairBot.csproj

      - name: Build
        run: dotnet build GoldH1PairBot/GoldH1PairBot.csproj --configuration Release --no-restore

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: GoldH1PairBot
          path: GoldH1PairBot/bin/Release/net6.0/