name: Build GoldH1PairBot

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Verify .NET
        run: |
          dotnet --version
          dotnet --list-runtimes

      - name: Install Homebrew
        run: |
          NONINTERACTIVE=1 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"

      - name: Add Homebrew to PATH
        run: |
          echo "/home/linuxbrew/.linuxbrew/bin" >> "$GITHUB_PATH"
          echo "/home/linuxbrew/.linuxbrew/sbin" >> "$GITHUB_PATH"

      - name: Install cTrader CLI
        run: |
          brew tap spotware/tap https://github.com/spotware/homebrew-tap
          brew install spotware/tap/ctrader-cli

      - name: Verify cTrader CLI
        run: |
          ctrader-cli --version
          ctrader-cli --help

      - name: Build GoldH1PairBot
        run: |
          ctrader-cli build --project-path=GoldH1PairBot.csproj

      - name: Find ALGO file
        run: |
          find . -type f -name "*.algo" -print

      - name: Upload ALGO file
        uses: actions/upload-artifact@v4
        with:
          name: GoldH1PairBot-algo
          path: "**/*.algo"
          if-no-files-found: error